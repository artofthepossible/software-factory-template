name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: make build
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # files: dist/*
